<header class="header">
  <mat-toolbar class="header__inner">
    <a mat-button class="header__logo" routerLink="/" aria-label="Dinkerspoint home">
      <img class="header__logo-image" src="/dinkerspoint-wordmark.png" alt="DinkersPoint" />
    </a>

    <button
      class="header__menu-toggle"
      mat-icon-button
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="header-nav"
      (click)="toggleMenu()"
    >
      <span class="header__menu-icon" aria-hidden="true"></span>
      <span class="header__menu-label">Menu</span>
    </button>

    <nav class="header__nav" id="header-nav" aria-label="Main" [class.header__nav--open]="menuOpen()">
      @for (link of links; track link.path) {
        <a
          class="header__link"
          [routerLink]="link.path"
          routerLinkActive="header__link--active"
          [routerLinkActiveOptions]="{ exact: link.exact ?? true }"
          >{{ link.label }}</a
        >
      }
    </nav>

    <!-- TODO: open the account dashboard for signed-in visitors. -->
    <button class="header__account" type="button" (click)="onAccountClick()">
      <span class="header__account-content">
        <svg
          class="header__account-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="10" r="3" />
          <path d="M5.8 18.4a7.2 7.2 0 0 1 12.4 0" />
        </svg>
        <span class="header__account-label">{{ isAuthenticated() ? 'User' : 'Account' }}</span>
      </span>
    </button>
  </mat-toolbar>
</header>
