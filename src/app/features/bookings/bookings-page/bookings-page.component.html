<main class="bookings">
  <header class="bookings__header">
    <h1 class="bookings__title">My Bookings</h1>
    <p class="bookings__subtitle">View and manage your upcoming and past court reservations.</p>
  </header>

  <app-booking-tabs
    [active]="activeTab()"
    [panelId]="panelId"
    (tabChange)="activeTab.set($event)"
  />

  <app-booking-list
    [bookings]="visibleBookings()"
    [emptyMessage]="emptyMessage()"
    [panelId]="panelId"
  />
</main>

<app-site-footer />
