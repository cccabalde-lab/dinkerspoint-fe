<a class="card" [routerLink]="['/bookings', booking().id]">
  <span class="card__info">
    <span class="card__date">{{ booking().date }}</span>
    <span class="card__line">{{ booking().time }}</span>
    <span class="card__line">{{ booking().court }}</span>
  </span>

  <span class="card__total">Total: {{ booking().total }}</span>
</a>
