<app-auth-shell>
  <app-auth-tabs />

  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-text-field
      label="Username or Email"
      autocomplete="username"
      [control]="form.controls.usernameOrEmail"
    />

    <app-text-field
      label="Password"
      type="password"
      autocomplete="new-password"
      [control]="form.controls.password"
    />

    <div class="consent">
      <input
        class="consent__box"
        type="checkbox"
        [formControl]="form.controls.acceptTerms"
      />
      <span class="consent__text">
        By signing up, you agree to our
        <!-- TODO: link the legal pages once they exist. -->
        <a class="consent__link" href="#">Terms &amp; Conditions</a>
        and
        <a class="consent__link" href="#">Privacy Policy</a>.
      </span>
    </div>

    @if (showTermsError) {
      <p class="consent__error">
        You must accept the Terms &amp; Conditions and Privacy Policy.
      </p>
    }

    <button class="form__submit" type="submit">Continue</button>
  </form>

  <div class="divider"></div>

  <app-google-button />
</app-auth-shell>
