<section class="policy" aria-labelledby="booking-policy-heading">
  <h2 class="policy__heading" id="booking-policy-heading">Booking Policy</h2>

  <div class="policy__rules">
    @for (rule of rules; track rule.title) {
      <mat-card class="policy__rule" appearance="outlined">
        <mat-card-header>
          <mat-card-title class="policy__rule-title">{{ rule.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content class="policy__rule-body">{{ rule.body }}</mat-card-content>
      </mat-card>
    }
  </div>
</section>
